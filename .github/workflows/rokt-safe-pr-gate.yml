name: Rokt Safe PR Gate

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: [Pull request]
    types: [completed]

permissions: {}

concurrency:
  group: rokt-safe-pr-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: >-
      vars.ROKT_SAFE_PR_GATE_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create mParticle App token
        id: mparticle-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ROKT_SAFE_PR_GATE_APP_ID }}
          private-key: ${{ secrets.ROKT_SAFE_PR_GATE_APP_PRIVATE_KEY }}
          owner: mParticle
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read

      - name: Create Rokt App token
        id: rokt-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ROKT_SAFE_PR_GATE_APP_ID }}
          private-key: ${{ secrets.ROKT_SAFE_PR_GATE_APP_PRIVATE_KEY }}
          owner: ROKT
          permission-members: read

      - name: Checkout trusted policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.mparticle-token.outputs.token }}

      - name: Evaluate pull request
        uses: ./.github/actions/rokt-safe-pr-gate
        with:
          api-url: ${{ github.api_url }}
          employee-team-slug: ${{ vars.ROKT_SAFE_PR_GATE_EMPLOYEE_TEAM_SLUG }}
          event-path: ${{ github.event_path }}
          gate-app-id: ${{ vars.ROKT_SAFE_PR_GATE_APP_ID }}
          gate-reviewer-login: ${{ vars.ROKT_SAFE_PR_GATE_REVIEWER_LOGIN }}
          mparticle-token: ${{ steps.mparticle-token.outputs.token }}
          policy-path: .github/rokt-safe-pr-gate-policy.json
          reviewer-token: ${{ secrets.ROKT_SAFE_PR_GATE_REVIEWER_TOKEN }}
          rokt-token: ${{ steps.rokt-token.outputs.token }}
