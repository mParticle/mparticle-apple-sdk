name: Rokt Safe PR Gate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to re-evaluate
        required: false
        type: string
  pull_request_target:
    types:
      [
        opened,
        reopened,
        ready_for_review,
        converted_to_draft,
        synchronize,
        edited,
      ]
  workflow_run:
    workflows: [Pull request]
    types: [completed]

permissions: {}

concurrency:
  # Scheduled sweeps and event-triggered runs can write checks for the same SHA.
  group: rokt-safe-pr-gate
  cancel-in-progress: false
  # trunk-ignore(actionlint/syntax-check): GitHub supports queue; Actionlint 1.7.7 predates it.
  queue: max

jobs:
  evaluate:
    if: >-
      vars.ROKT_SAFE_PR_GATE_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create mParticle App token
        id: mparticle-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ROKT_SAFE_PR_GATE_MPARTICLE_APP_ID }}
          private-key: ${{ secrets.ROKT_SAFE_PR_GATE_MPARTICLE_APP_PRIVATE_KEY }}
          owner: mParticle
          repositories: mparticle-apple-sdk
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-members: read
          permission-pull-requests: read

      - name: Create Rokt App token
        id: rokt-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ROKT_SAFE_PR_GATE_ROKT_APP_ID }}
          private-key: ${{ secrets.ROKT_SAFE_PR_GATE_ROKT_APP_PRIVATE_KEY }}
          owner: ROKT
          permission-members: read

      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.mparticle-token.outputs.token }}

      - name: Evaluate pull request
        uses: ./.github/actions/rokt-safe-pr-gate
        with:
          api-url: ${{ github.api_url }}
          employee-team-slug: ${{ vars.ROKT_SAFE_PR_GATE_EMPLOYEE_TEAM_SLUG }}
          event-path: ${{ github.event_path }}
          evaluation-id: ${{ github.run_id }}-${{ github.run_attempt }}
          gate-app-id: ${{ vars.ROKT_SAFE_PR_GATE_MPARTICLE_APP_ID }}
          manual-review-team-slug: ${{ vars.ROKT_SAFE_PR_GATE_MANUAL_REVIEW_TEAM_SLUG }}
          mparticle-token: ${{ steps.mparticle-token.outputs.token }}
          policy-path: .github/rokt-safe-pr-gate-policy.json
          pr-number: ${{ inputs.pull_request_number }}
          rokt-token: ${{ steps.rokt-token.outputs.token }}
          mode: ${{ vars.ROKT_SAFE_PR_GATE_MODE }}
