name: iOS SDK Build and Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_VERSION: "16.4"

jobs:
  trunk-check:
    runs-on: macOS-15
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1

  pod-lint:
    runs-on: macOS-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache Ruby gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # RubyGems only uses ~/.gem when that directory already exists; a
          # fresh runner has neither, so --user-install falls back to the XDG
          # path. Cache both so whichever one RubyGems actually picks is saved.
          path: |
            ~/.gem
            ~/.local/share/gem
          key: gems-xcodeproj-${{ runner.os }}

      - name: Update xcodeproj gem
        run: gem install xcodeproj -v 1.28.1 --user-install # zizmor: ignore[adhoc-packages] Avoid a CI-only lockfile.

      - name: Prevent social URL warnings if twitter is unreachable
        run: find . -path '*.podspec' -exec perl -pi -e 's/.+\.social_media_url.+//' {} \;

      - name: Lint with CocoaPods
        run: pod lib lint mParticle-Apple-SDK.podspec --include-podspecs="{mParticle-Apple-SDK-Swift.podspec,mParticle-Apple-SDK-ObjC.podspec,mParticle-Apple-SDK.podspec}"

      - name: Undo twitter change to podspec
        run: git checkout *.podspec

  xcode-build:
    runs-on: macOS-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Build SDK
        run: |
          set -o pipefail
          xcodebuild \
            -project "mParticle-Apple-SDK.xcodeproj" \
            -scheme "mParticle-Apple-SDK" \
            -destination "generic/platform=iOS" \
            clean build | xcpretty

  run-analyzer:
    runs-on: macOS-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Run static analyzer
        run: |
          # Fail if any *diagnostic* warnings remain after allowlist filters.
          # Use ': warning:' (clang/Xcode style) — not bare 'warning', which false-positives on
          # swiftc flags like -suppress-warnings in Swift package builds (e.g. RoktContracts).
          bash -c '! (set -o pipefail && xcodebuild -project "mParticle-Apple-SDK.xcodeproj" -scheme "mParticle-Apple-SDK" -sdk iphonesimulator -configuration Debug -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest" clean analyze | grep -v "warning: The iOS Simulator deployment target" | grep -v "warning: Metadata extraction skipped" | grep -F -v "Repeated use of MParticle sharedInstance in one method; assign to a local variable once." | grep -F -v "warning: Run script build phase '"'"'Run Script'"'"' will be run during every build" | grep -B3 ": warning:")'
