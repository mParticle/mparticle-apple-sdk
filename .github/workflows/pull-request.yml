name: Pull request

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release*
      - workstation*
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rokt-safe-pr-gate-tests:
    name: Rokt Safe PR gate tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test gate policy
        run: node --test .github/actions/rokt-safe-pr-gate/test/gate.test.js

  build-and-lint:
    uses: ./.github/workflows/build-and-lint.yml
    secrets: inherit

  native-tests:
    uses: ./.github/workflows/native-tests.yml
    secrets: inherit

  # TODO: Re-enable after 9.0 release
  # build-secondary-platforms:
  #   uses: ./.github/workflows/build-secondary-platforms.yml
  #   secrets: inherit

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  size-report:
    uses: ./.github/workflows/size-report.yml
    secrets: inherit

  build-kits:
    uses: ./.github/workflows/build-kits.yml
    secrets: inherit

  pr-notify:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs:
      - build-and-lint
      - native-tests
      # - build-secondary-platforms  # TODO: Re-enable after 9.0 release
      - integration-tests
      - size-report
      - build-kits
    name: Notify GChat
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}
