name: SDK Size Report

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  XCODE_VERSION: "16.4"
  COMMENT_IDENTIFIER: "<!-- sdk-size-report -->"
  # Fail the job when the SDK's app-bundle impact grows by more than this. Note the
  # ruleset covering main and workstation/* requires no status checks, so this only
  # gates a merge once someone marks the check required.
  SIZE_DELTA_THRESHOLD_KB: "50"

jobs:
  measure-size:
    runs-on: macOS-15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr-branch

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base-branch

      - name: Pin the PR fixture into the target checkout
        # Both sides are measured with the same fixture apps and scripts, against
        # their own SDK and kit sources. The target branch may predate a fixture, and
        # a fixture change would otherwise read as an SDK size change.
        run: |
          rm -rf base-branch/Tests/SizeReport
          cp -R pr-branch/Tests/SizeReport base-branch/Tests/SizeReport

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Build and measure target branch
        id: base-size
        working-directory: base-branch
        continue-on-error: true
        run: |
          # Check if the size test apps and script exist on base branch
          if [[ -d "Tests/SizeReport/SizeTestAppWithSDK" ]] && [[ -d "Tests/SizeReport/SizeTestApp" ]] && [[ -f "Tests/SizeReport/measure_size.sh" ]]; then
            chmod +x Tests/SizeReport/measure_size.sh
            RESULT=$(Tests/SizeReport/measure_size.sh --json 2>/dev/null)
            if [[ $? -eq 0 ]] && [[ -n "$RESULT" ]]; then
              echo "json=${RESULT}" >> $GITHUB_OUTPUT
              # Extract SDK impact (delta between with-SDK and baseline)
              SDK_IMPACT_KB=$(echo "$RESULT" | jq -r '.sdk_impact_kb')
              SDK_EXECUTABLE_IMPACT=$(echo "$RESULT" | jq -r '.sdk_executable_impact_bytes')
              XCFRAMEWORK_SIZE_KB=$(echo "$RESULT" | jq -r '.xcframework_size_kb // 0')
              # framework_size_kb and dsym_size_kb were added later, so a base branch
              # running an older measure_size.sh will not emit them.
              FRAMEWORK_SIZE_KB=$(echo "$RESULT" | jq -r '.framework_size_kb // 0')
              DSYM_SIZE_KB=$(echo "$RESULT" | jq -r '.dsym_size_kb // 0')
              echo "sdk_impact_kb=${SDK_IMPACT_KB}" >> $GITHUB_OUTPUT
              echo "sdk_executable_impact=${SDK_EXECUTABLE_IMPACT}" >> $GITHUB_OUTPUT
              echo "xcframework_size_kb=${XCFRAMEWORK_SIZE_KB}" >> $GITHUB_OUTPUT
              echo "framework_size_kb=${FRAMEWORK_SIZE_KB}" >> $GITHUB_OUTPUT
              echo "dsym_size_kb=${DSYM_SIZE_KB}" >> $GITHUB_OUTPUT
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "Build failed on base branch"
              echo 'json={"sdk_impact_kb": 0, "sdk_executable_impact_bytes": 0, "xcframework_size_kb": 0}' >> $GITHUB_OUTPUT
              echo "sdk_impact_kb=0" >> $GITHUB_OUTPUT
              echo "sdk_executable_impact=0" >> $GITHUB_OUTPUT
              echo "xcframework_size_kb=0" >> $GITHUB_OUTPUT
              echo "framework_size_kb=0" >> $GITHUB_OUTPUT
              echo "dsym_size_kb=0" >> $GITHUB_OUTPUT
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Size test app not found on base branch, this PR introduces it"
            echo 'json={"sdk_impact_kb": 0, "sdk_executable_impact_bytes": 0, "xcframework_size_kb": 0}' >> $GITHUB_OUTPUT
            echo "sdk_impact_kb=0" >> $GITHUB_OUTPUT
            echo "sdk_executable_impact=0" >> $GITHUB_OUTPUT
            echo "xcframework_size_kb=0" >> $GITHUB_OUTPUT
            echo "framework_size_kb=0" >> $GITHUB_OUTPUT
            echo "dsym_size_kb=0" >> $GITHUB_OUTPUT
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and measure PR branch
        id: pr-size
        working-directory: pr-branch
        run: |
          chmod +x Tests/SizeReport/measure_size.sh
          RESULT=$(Tests/SizeReport/measure_size.sh --json)
          echo "json=${RESULT}" >> $GITHUB_OUTPUT
          # Extract SDK impact (delta between with-SDK and baseline)
          SDK_IMPACT_KB=$(echo "$RESULT" | jq -r '.sdk_impact_kb')
          SDK_EXECUTABLE_IMPACT=$(echo "$RESULT" | jq -r '.sdk_executable_impact_bytes')
          XCFRAMEWORK_SIZE_KB=$(echo "$RESULT" | jq -r '.xcframework_size_kb // 0')
          FRAMEWORK_SIZE_KB=$(echo "$RESULT" | jq -r '.framework_size_kb // 0')
          DSYM_SIZE_KB=$(echo "$RESULT" | jq -r '.dsym_size_kb // 0')
          echo "sdk_impact_kb=${SDK_IMPACT_KB}" >> $GITHUB_OUTPUT
          echo "sdk_executable_impact=${SDK_EXECUTABLE_IMPACT}" >> $GITHUB_OUTPUT
          echo "xcframework_size_kb=${XCFRAMEWORK_SIZE_KB}" >> $GITHUB_OUTPUT
          echo "framework_size_kb=${FRAMEWORK_SIZE_KB}" >> $GITHUB_OUTPUT
          echo "dsym_size_kb=${DSYM_SIZE_KB}" >> $GITHUB_OUTPUT

      - name: Attribute the framework bytes
        id: composition
        continue-on-error: true
        run: |
          # analyze_binary.sh only exists on the PR branch, so run the PR branch's copy
          # against both builds. Splitting the framework into code, Swift metadata,
          # ObjC metadata and __LINKEDIT is what makes a regression diagnosable from
          # the comment instead of only visible.
          ANALYZE="${GITHUB_WORKSPACE}/pr-branch/Tests/SizeReport/analyze_binary.sh"
          chmod +x "$ANALYZE"

          summarize() {
            local root="$1" out="$2"
            local fw
            fw=$(find "${root}/Tests/SizeReport/build/mParticle_Apple_SDK.xcframework" \
                   -maxdepth 2 -name '*.framework' -type d 2>/dev/null | head -1)
            if [[ -n "$fw" ]]; then
              "$ANALYZE" "$fw" --json > "$out" 2>/dev/null || echo '{}' > "$out"
            else
              echo '{}' > "$out"
            fi
          }

          summarize "${GITHUB_WORKSPACE}/pr-branch" "${RUNNER_TEMP}/pr-composition.json"
          summarize "${GITHUB_WORKSPACE}/base-branch" "${RUNNER_TEMP}/base-composition.json"

          # Render a markdown table of the composition and its delta.
          python3 - "${RUNNER_TEMP}/base-composition.json" "${RUNNER_TEMP}/pr-composition.json" \
            > "${RUNNER_TEMP}/composition.md" <<'PYEOF'
          import json, sys

          def load(path):
              try:
                  with open(path) as handle:
                      return json.load(handle)
              except Exception:
                  return {}

          base, pr = load(sys.argv[1]), load(sys.argv[2])
          rows = [
              ("Executable code (`__text`)", "total_text_bytes"),
              ("Swift metadata (`__swift5_*`)", "total_swift_metadata_bytes"),
              ("ObjC metadata (`__objc_*`)", "total_objc_metadata_bytes"),
              ("Symbol tables (`__LINKEDIT`)", "total_linkedit_bytes"),
              ("Mach-O images", "image_count"),
              ("Exported symbols", "total_exported_symbols"),
          ]

          def show(key, value):
              if value is None:
                  return "n/a"
              if key in ("image_count", "total_exported_symbols"):
                  return str(value)
              return f"{value / 1024:.1f} KB"

          if not pr:
              print("_Composition data unavailable for this run._")
          else:
              print("| Component | Target branch | This PR | Change |")
              print("|---|---|---|---|")
              for label, key in rows:
                  b, p = base.get(key), pr.get(key)
                  if b is None or p is None:
                      change = "n/a"
                  elif key in ("image_count", "total_exported_symbols"):
                      change = f"{p - b:+d}"
                  else:
                      change = f"{(p - b) / 1024:+.1f} KB"
                  print(f"| {label} | {show(key, b)} | {show(key, p)} | {change} |")
          PYEOF

          echo "path=${RUNNER_TEMP}/composition.md" >> $GITHUB_OUTPUT

      - name: Render the Core + Rokt kit section
        id: kit
        env:
          SAFE_STEPS_BASE_SIZE_OUTPUTS_JSON: ${{ steps.base-size.outputs.json }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_JSON: ${{ steps.pr-size.outputs.json }}
        run: |
          python3 - "${RUNNER_TEMP}/kit.md" <<'PYEOF'
          import json, os, sys

          # Same threshold as the core status, in KB.
          NEUTRAL_KB = 50

          def load(name):
              try:
                  return json.loads(os.environ.get(name) or "{}")
              except ValueError:
                  return {}

          base = load("SAFE_STEPS_BASE_SIZE_OUTPUTS_JSON")
          pr = load("SAFE_STEPS_PR_SIZE_OUTPUTS_JSON")

          def size(kb):
              if kb is None:
                  return "not measured"
              sign = "-" if kb < 0 else ""
              kb = abs(kb)
              return f"{sign}{kb / 1024:.2f} MB" if kb >= 1024 else f"{sign}{kb} KB"

          def change(b, p):
              if b is None or p is None:
                  return "not measured", None
              d = p - b
              return ("+" if d >= 0 else "") + size(d), d

          rows, deltas = [], []
          for label, key in (("App Bundle Impact", "kit_impact_kb"), ("Kit on top of the SDK", "kit_over_core_kb")):
              text, d = change(base.get(key), pr.get(key))
              rows.append(f"| {label} | {size(base.get(key))} | {size(pr.get(key))} | {text} |")
              if key == "kit_impact_kb" and d is not None:
                  deltas.append(d)

          if not deltas:
              status = "none"
          elif deltas[0] > NEUTRAL_KB:
              status = "increase"
          elif deltas[0] < -NEUTRAL_KB:
              status = "decrease"
          else:
              status = "neutral"

          with open(sys.argv[1], "w") as out:
              out.write("\n".join([
                  "### mParticle Core + Rokt kit",
                  "",
                  "The SDK and the Rokt kit built from source by SwiftPM and linked statically, as a",
                  "SwiftPM app takes them. `Kit on top of the SDK` is measured against the SDK built",
                  "the same way. Rokt SDK versions are pinned in `Tests/SizeReport/RoktKitSDK`.",
                  "Report-only: the size budget applies to the core number above.",
                  "",
                  "| Metric | Target Branch | This PR | Change |",
                  "|--------|---------------|---------|--------|",
                  *rows,
                  "",
              ]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={status}\n")
          PYEOF
          echo "path=${RUNNER_TEMP}/kit.md" >> "$GITHUB_OUTPUT"

      - name: Calculate size delta
        id: delta
        env:
          SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_IMPACT_KB: ${{ steps.base-size.outputs.sdk_impact_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_IMPACT_KB: ${{ steps.pr-size.outputs.sdk_impact_kb }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT: ${{ steps.base-size.outputs.sdk_executable_impact }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT: ${{ steps.pr-size.outputs.sdk_executable_impact }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB: ${{ steps.base-size.outputs.xcframework_size_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB: ${{ steps.pr-size.outputs.xcframework_size_kb }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB: ${{ steps.base-size.outputs.framework_size_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB: ${{ steps.pr-size.outputs.framework_size_kb }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_EXISTS: ${{ steps.base-size.outputs.exists }}
        run: |
          BASE_SDK_IMPACT=${SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_IMPACT_KB}
          PR_SDK_IMPACT=${SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_IMPACT_KB}
          BASE_EXECUTABLE_IMPACT=${SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT}
          PR_EXECUTABLE_IMPACT=${SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT}
          BASE_XCFRAMEWORK=${SAFE_STEPS_BASE_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB}
          PR_XCFRAMEWORK=${SAFE_STEPS_PR_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB}
          BASE_FRAMEWORK=${SAFE_STEPS_BASE_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB}
          PR_FRAMEWORK=${SAFE_STEPS_PR_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB}
          BASE_EXISTS=${SAFE_STEPS_BASE_SIZE_OUTPUTS_EXISTS}

          # Handle case where base branch doesn't have the test app
          if [[ "$BASE_EXISTS" != "true" ]] || [[ "$BASE_SDK_IMPACT" == "0" ]]; then
            echo "delta_kb=N/A" >> $GITHUB_OUTPUT
            echo "delta_executable=N/A" >> $GITHUB_OUTPUT
            echo "delta_xcframework=N/A" >> $GITHUB_OUTPUT
            echo "delta_framework=N/A" >> $GITHUB_OUTPUT
            echo "delta_percent=N/A" >> $GITHUB_OUTPUT
            echo "status=new" >> $GITHUB_OUTPUT
          else
            DELTA_KB=$((PR_SDK_IMPACT - BASE_SDK_IMPACT))
            DELTA_EXECUTABLE=$((PR_EXECUTABLE_IMPACT - BASE_EXECUTABLE_IMPACT))
            DELTA_XCFRAMEWORK=$((PR_XCFRAMEWORK - BASE_XCFRAMEWORK))
            # A zero base means the base branch predates the framework/dSYM split.
            if [[ "$BASE_FRAMEWORK" -gt 0 ]]; then
              DELTA_FRAMEWORK=$((PR_FRAMEWORK - BASE_FRAMEWORK))
            else
              DELTA_FRAMEWORK="N/A"
            fi
            
            if [[ "$BASE_SDK_IMPACT" -gt 0 ]]; then
              DELTA_PERCENT=$(awk "BEGIN {printf \"%.2f\", ($DELTA_KB / $BASE_SDK_IMPACT) * 100}")
            else
              DELTA_PERCENT="0.00"
            fi
            
            echo "delta_kb=${DELTA_KB}" >> $GITHUB_OUTPUT
            echo "delta_executable=${DELTA_EXECUTABLE}" >> $GITHUB_OUTPUT
            echo "delta_xcframework=${DELTA_XCFRAMEWORK}" >> $GITHUB_OUTPUT
            echo "delta_framework=${DELTA_FRAMEWORK}" >> $GITHUB_OUTPUT
            echo "delta_percent=${DELTA_PERCENT}" >> $GITHUB_OUTPUT
            
            # Determine status emoji
            if [[ "$DELTA_KB" -gt 50 ]]; then
              echo "status=increase" >> $GITHUB_OUTPUT
            elif [[ "$DELTA_KB" -lt -50 ]]; then
              echo "status=decrease" >> $GITHUB_OUTPUT
            else
              echo "status=neutral" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Format size for display
        id: format
        env:
          SAFE_STEPS_BASE_SIZE_OUTPUTS_EXISTS: ${{ steps.base-size.outputs.exists }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_IMPACT_KB: ${{ steps.base-size.outputs.sdk_impact_kb }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT: ${{ steps.base-size.outputs.sdk_executable_impact }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB: ${{ steps.base-size.outputs.xcframework_size_kb }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB: ${{ steps.base-size.outputs.framework_size_kb }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_DSYM_SIZE_KB: ${{ steps.base-size.outputs.dsym_size_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_IMPACT_KB: ${{ steps.pr-size.outputs.sdk_impact_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT: ${{ steps.pr-size.outputs.sdk_executable_impact }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB: ${{ steps.pr-size.outputs.xcframework_size_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB: ${{ steps.pr-size.outputs.framework_size_kb }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_DSYM_SIZE_KB: ${{ steps.pr-size.outputs.dsym_size_kb }}
          SAFE_STEPS_DELTA_OUTPUTS_DELTA_KB: ${{ steps.delta.outputs.delta_kb }}
          SAFE_STEPS_DELTA_OUTPUTS_DELTA_EXECUTABLE: ${{ steps.delta.outputs.delta_executable }}
          SAFE_STEPS_DELTA_OUTPUTS_DELTA_XCFRAMEWORK: ${{ steps.delta.outputs.delta_xcframework }}
          SAFE_STEPS_DELTA_OUTPUTS_DELTA_FRAMEWORK: ${{ steps.delta.outputs.delta_framework }}
        run: |
          BASE_EXISTS=${SAFE_STEPS_BASE_SIZE_OUTPUTS_EXISTS}

          # Format KB to human readable
          format_size() {
            local kb=$1
            if [[ "$kb" == "0" || "$kb" == "N/A" ]]; then
              echo "N/A"
            elif [[ "$kb" -ge 1024 ]]; then
              awk "BEGIN {printf \"%.2f MB\", $kb / 1024}"
            else
              echo "${kb} KB"
            fi
          }

          format_bytes() {
            local bytes=$1
            if [[ "$bytes" == "0" || "$bytes" == "N/A" ]]; then
              echo "N/A"
            elif [[ "$bytes" -ge 1048576 ]]; then
              awk "BEGIN {printf \"%.2f MB\", $bytes / 1048576}"
            elif [[ "$bytes" -ge 1024 ]]; then
              awk "BEGIN {printf \"%.2f KB\", $bytes / 1024}"
            else
              echo "${bytes} bytes"
            fi
          }

          # Format SDK impact sizes - show N/A if base doesn't exist
          if [[ "$BASE_EXISTS" == "true" ]]; then
            echo "base_impact_formatted=$(format_size ${SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_IMPACT_KB})" >> $GITHUB_OUTPUT
            echo "base_executable_formatted=$(format_bytes ${SAFE_STEPS_BASE_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT})" >> $GITHUB_OUTPUT
            echo "base_xcframework_formatted=$(format_size ${SAFE_STEPS_BASE_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB})" >> $GITHUB_OUTPUT
            echo "base_framework_formatted=$(format_size ${SAFE_STEPS_BASE_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB})" >> $GITHUB_OUTPUT
            echo "base_dsym_formatted=$(format_size ${SAFE_STEPS_BASE_SIZE_OUTPUTS_DSYM_SIZE_KB})" >> $GITHUB_OUTPUT
          else
            echo "base_impact_formatted=N/A" >> $GITHUB_OUTPUT
            echo "base_executable_formatted=N/A" >> $GITHUB_OUTPUT
            echo "base_xcframework_formatted=N/A" >> $GITHUB_OUTPUT
            echo "base_framework_formatted=N/A" >> $GITHUB_OUTPUT
            echo "base_dsym_formatted=N/A" >> $GITHUB_OUTPUT
          fi

          echo "pr_impact_formatted=$(format_size ${SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_IMPACT_KB})" >> $GITHUB_OUTPUT
          echo "pr_executable_formatted=$(format_bytes ${SAFE_STEPS_PR_SIZE_OUTPUTS_SDK_EXECUTABLE_IMPACT})" >> $GITHUB_OUTPUT
          echo "pr_xcframework_formatted=$(format_size ${SAFE_STEPS_PR_SIZE_OUTPUTS_XCFRAMEWORK_SIZE_KB})" >> $GITHUB_OUTPUT
          echo "pr_framework_formatted=$(format_size ${SAFE_STEPS_PR_SIZE_OUTPUTS_FRAMEWORK_SIZE_KB})" >> $GITHUB_OUTPUT
          echo "pr_dsym_formatted=$(format_size ${SAFE_STEPS_PR_SIZE_OUTPUTS_DSYM_SIZE_KB})" >> $GITHUB_OUTPUT

          DELTA_KB="${SAFE_STEPS_DELTA_OUTPUTS_DELTA_KB}"
          DELTA_EXECUTABLE="${SAFE_STEPS_DELTA_OUTPUTS_DELTA_EXECUTABLE}"
          DELTA_XCFRAMEWORK="${SAFE_STEPS_DELTA_OUTPUTS_DELTA_XCFRAMEWORK}"
          DELTA_FRAMEWORK="${SAFE_STEPS_DELTA_OUTPUTS_DELTA_FRAMEWORK}"

          if [[ "$DELTA_KB" != "N/A" ]]; then
            if [[ "$DELTA_KB" -ge 0 ]]; then
              echo "delta_formatted=+$(format_size $DELTA_KB)" >> $GITHUB_OUTPUT
            else
              echo "delta_formatted=$(format_size $DELTA_KB)" >> $GITHUB_OUTPUT
            fi
            
            if [[ "$DELTA_EXECUTABLE" -ge 0 ]]; then
              echo "delta_executable_formatted=+$(format_bytes $DELTA_EXECUTABLE)" >> $GITHUB_OUTPUT
            else
              echo "delta_executable_formatted=$(format_bytes $DELTA_EXECUTABLE)" >> $GITHUB_OUTPUT
            fi

            if [[ "$DELTA_XCFRAMEWORK" -ge 0 ]]; then
              echo "delta_xcframework_formatted=+$(format_size $DELTA_XCFRAMEWORK)" >> $GITHUB_OUTPUT
            else
              echo "delta_xcframework_formatted=$(format_size $DELTA_XCFRAMEWORK)" >> $GITHUB_OUTPUT
            fi

            if [[ "$DELTA_FRAMEWORK" == "N/A" ]]; then
              echo "delta_framework_formatted=N/A" >> $GITHUB_OUTPUT
            elif [[ "$DELTA_FRAMEWORK" -ge 0 ]]; then
              echo "delta_framework_formatted=+$(format_size $DELTA_FRAMEWORK)" >> $GITHUB_OUTPUT
            else
              echo "delta_framework_formatted=$(format_size $DELTA_FRAMEWORK)" >> $GITHUB_OUTPUT
            fi
          else
            echo "delta_formatted=N/A (new baseline)" >> $GITHUB_OUTPUT
            echo "delta_executable_formatted=N/A (new baseline)" >> $GITHUB_OUTPUT
            echo "delta_xcframework_formatted=N/A (new baseline)" >> $GITHUB_OUTPUT
            echo "delta_framework_formatted=N/A (new baseline)" >> $GITHUB_OUTPUT
          fi

      - name: Generate size report
        id: report
        env:
          SAFE_STEPS_DELTA_OUTPUTS_STATUS: ${{ steps.delta.outputs.status }}
          SAFE_STEPS_KIT_OUTPUTS_STATUS: ${{ steps.kit.outputs.status }}
          SAFE_STEPS_KIT_OUTPUTS_PATH: ${{ steps.kit.outputs.path }}
          SAFE_STEPS_FORMAT_OUTPUTS_BASE_IMPACT_FORMATTED: ${{ steps.format.outputs.base_impact_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_PR_IMPACT_FORMATTED: ${{ steps.format.outputs.pr_impact_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_DELTA_FORMATTED: ${{ steps.format.outputs.delta_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_BASE_EXECUTABLE_FORMATTED: ${{ steps.format.outputs.base_executable_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_PR_EXECUTABLE_FORMATTED: ${{ steps.format.outputs.pr_executable_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_DELTA_EXECUTABLE_FORMATTED: ${{ steps.format.outputs.delta_executable_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_BASE_FRAMEWORK_FORMATTED: ${{ steps.format.outputs.base_framework_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_PR_FRAMEWORK_FORMATTED: ${{ steps.format.outputs.pr_framework_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_DELTA_FRAMEWORK_FORMATTED: ${{ steps.format.outputs.delta_framework_formatted }}
          SAFE_STEPS_COMPOSITION_OUTPUTS_PATH: ${{ steps.composition.outputs.path }}
          SAFE_STEPS_FORMAT_OUTPUTS_BASE_DSYM_FORMATTED: ${{ steps.format.outputs.base_dsym_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_PR_DSYM_FORMATTED: ${{ steps.format.outputs.pr_dsym_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_BASE_XCFRAMEWORK_FORMATTED: ${{ steps.format.outputs.base_xcframework_formatted }}
          SAFE_STEPS_FORMAT_OUTPUTS_PR_XCFRAMEWORK_FORMATTED: ${{ steps.format.outputs.pr_xcframework_formatted }}
          SAFE_GITHUB_BASE_REF_MAIN: ${{ github.base_ref || 'main' }}
          SAFE_STEPS_BASE_SIZE_OUTPUTS_JSON: ${{ steps.base-size.outputs.json }}
          SAFE_STEPS_PR_SIZE_OUTPUTS_JSON: ${{ steps.pr-size.outputs.json }}
        run: |
          REPORT_FILE="${RUNNER_TEMP}/size-report.md"

          # Determine status message
          STATUS="${SAFE_STEPS_DELTA_OUTPUTS_STATUS}"
          KIT_STATUS="${SAFE_STEPS_KIT_OUTPUTS_STATUS}"
          # An increase in either stack wins, so a shrink in one cannot hide growth in the other.
          if [[ "$STATUS" == "increase" || "$KIT_STATUS" == "increase" ]]; then
            STATUS="increase"
          elif [[ "$STATUS" == "neutral" && "$KIT_STATUS" == "decrease" ]]; then
            STATUS="decrease"
          fi
          case "$STATUS" in
            increase) STATUS_MSG="⚠️ This change increases SDK size impact." ;;
            decrease) STATUS_MSG="✅ This change decreases SDK size impact." ;;
            neutral)  STATUS_MSG="➡️ SDK size impact change is minimal." ;;
            new)      STATUS_MSG="ℹ️ Size test app not found on target branch. This is the new baseline." ;;
            *)        STATUS_MSG="" ;;
          esac

          # Generate the report
          cat > "$REPORT_FILE" << EOF
          ${{ env.COMMENT_IDENTIFIER }}
          ## 📦 SDK Size Impact Report

          Measures how much the SDK adds to an app's size (with-SDK minus without-SDK).

          | Metric | Target Branch | This PR | Change |
          |--------|---------------|---------|--------|
          | App Bundle Impact | ${SAFE_STEPS_FORMAT_OUTPUTS_BASE_IMPACT_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_PR_IMPACT_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_DELTA_FORMATTED} |
          | Executable Impact | ${SAFE_STEPS_FORMAT_OUTPUTS_BASE_EXECUTABLE_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_PR_EXECUTABLE_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_DELTA_EXECUTABLE_FORMATTED} |
          | Framework binary (ships) | ${SAFE_STEPS_FORMAT_OUTPUTS_BASE_FRAMEWORK_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_PR_FRAMEWORK_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_DELTA_FRAMEWORK_FORMATTED} |

          $(cat "${SAFE_STEPS_KIT_OUTPUTS_PATH}" 2>/dev/null || echo "_Core + Rokt kit data unavailable._")

          ${STATUS_MSG}

          ### Where the bytes are

          $(cat "${SAFE_STEPS_COMPOSITION_OUTPUTS_PATH}" 2>/dev/null || echo "_Composition data unavailable._")

          <details>
          <summary>Debug symbols (not shipped to users)</summary>

          The SDK is embedded as a dynamic framework, so the app's own executable barely
          moves and \`App Bundle Impact\` is the number that tracks shipped code.
          \`xcodebuild -create-xcframework\` folds the dSYM in beside the framework, so the
          xcframework total is mostly debug symbols and is not a shipping cost.

          | | Target Branch | This PR |
          |---|---|---|
          | dSYMs | ${SAFE_STEPS_FORMAT_OUTPUTS_BASE_DSYM_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_PR_DSYM_FORMATTED} |
          | XCFramework total | ${SAFE_STEPS_FORMAT_OUTPUTS_BASE_XCFRAMEWORK_FORMATTED} | ${SAFE_STEPS_FORMAT_OUTPUTS_PR_XCFRAMEWORK_FORMATTED} |
          </details>

