version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
  # Each kit track (e.g. appsflyer-6) is pinned to one major version of its third-party SDK, and a new
  # major gets its own track (e.g. apptentive-7), so only minor and patch updates apply here.
  - package-ecosystem: swift
    directories:
      - /Kits/*/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  # RNExample only (Example/Podfile has no lockfile, so cocoapods isn't addable).
  - package-ecosystem: bundler
    directory: /RNExample
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
