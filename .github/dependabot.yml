version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
  - package-ecosystem: swift
    directories:
      - /
      - /Kits/*/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
  # RNExample only (Example/Podfile has no lockfile, so cocoapods isn't addable).
  - package-ecosystem: bundler
    directory: /RNExample
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
